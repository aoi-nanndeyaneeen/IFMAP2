# ifmap (Flutter Web) を GitHub Pages に自動デプロイする。
# main に push するだけで https://aoi-nanndeyaneeen.github.io/IFMAP2/ が更新される。
name: Deploy ifmap to Pages

on:
  push:
    branches: [main]
    paths:
      - 'ifmap/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:   # 手動実行用（Actionsタブから押せる）

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ（新しい push を優先）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 解析とテストが通らないものは公開しない。
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Pages の有効化は GITHUB_TOKEN では出来ないので、リポジトリの
      # Settings > Pages > Source を "GitHub Actions" に一度だけ手動設定する。
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'   # ローカルと揃える
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: ifmap
        run: flutter pub get

      # エディタ専用の見取り図画像(bgImageBase64)を公開物からだけ取り除く。
      # ifmap は読まないのに約6MBあり、毎回ダウンロードされていた。
      # ここで書き換えるのは CI のチェックアウトだけで、リポジトリの JSON は
      # そのままなのでエディタでの再編集には影響しない。
      - name: strip editor-only data from map assets
        working-directory: ifmap
        run: dart run tool/strip_bg_image.dart --apply

      # base-href はリポジトリ名。Pages が /IFMAP2/ 配下に置かれるため必須。
      - name: flutter build web
        working-directory: ifmap
        run: flutter build web --release --base-href /IFMAP2/ --no-wasm-dry-run

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ifmap/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
