name: ifmap
description: "infacilityMAP - 屋内ナビゲーションアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  mobile_scanner: ^4.0.1
  sensors_plus: 7.0.0
  flutter_compass: ^0.8.1
  geolocator: ^10.1.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # ディレクトリ単位で登録している。建物フォルダに JSON を置いて
    # config.dart の mapSections にエントリを足せば、ここは触らなくてよい。
    - assets/NITTC/
    - assets/home/
    - assets/dorm/
    - assets/welfare/
    - assets/gym/
    # 区域/建物/階/部屋 の索引（tool/pdf_maps/build_index.py が書く）
    - assets/campus_index.json
