<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- スマホ表示。ダブルタップ拡大を切って地図側のピンチ操作に任せる。
       viewport-fit=cover は付けないこと。black-translucent と組み合わせると
       standalone 起動時にコンテンツがステータスバーの下まで広がり、
       描画位置とタップ判定が縦にずれる。 -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="見取り図ベースの屋内ナビゲーション infacilityMAP">

  <!-- ホーム画面に追加したときフルスクリーンで開く(iOS)。
       status-bar-style は black（不透明）にしておく。translucent にすると
       ステータスバー分だけタップ座標がずれる。 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ifmap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ifmap</title>
  <link rel="manifest" href="manifest.json">

  <!-- mobile_scanner (Web) が使う QR デコーダ -->
  <script src="https://unpkg.com/@zxing/library@0.19.1" type="application/javascript"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;            /* Safari の引っぱりバウンスを止める */
      overscroll-behavior: none;
      background-color: #0175C2;
    }
  </style>
</head>
<body>
  <!-- flutter build web が生成する起動スクリプト。
       Flutter 3.41 のオフラインキャッシュ用 Service Worker は廃止済みで、
       出力される flutter_service_worker.js は自分を登録解除するだけ。
       更新は毎回ネットワークから読まれる（オフラインでは起動しない）。 -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
